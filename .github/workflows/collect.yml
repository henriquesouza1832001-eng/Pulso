name: Coleta

# Um ciclo = coletar fontes → processar → enviar lote ao Worker (idempotente).
# Agendamentos só rodam a partir da branch principal. O intervalo mínimo do GitHub é 5 min
# e pode atrasar sob carga; para tempo real use container/VM (docs/COLLECTION_PROTOCOL.md §10).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "Enviar ao Worker de produção? (false = simulação)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false  # nunca duas rodadas ao mesmo tempo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e engine
      - name: Rodar o Engine
        working-directory: engine
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_INGEST_TOKEN: ${{ secrets.PULSO_INGEST_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" != "true" ]; then
            python -m pulso_engine.pipeline
          else
            python -m pulso_engine.pipeline --push
          fi
