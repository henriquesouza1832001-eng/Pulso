name: Coleta

# Um ciclo = coletar fontes → processar → enviar lote ao Worker (idempotente).
# Agendamentos só rodam a partir da branch principal. O intervalo mínimo do GitHub é 5 min
# e pode atrasar sob carga; para tempo real use container/VM (docs/COLLECTION_PROTOCOL.md §10).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "Enviar ao Worker de produção? (false = simulação)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false  # nunca duas rodadas ao mesmo tempo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Sensores sociais (Reddit/X); ver docs/sources/SOURCES.md. Sem os secrets, nada social roda.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e engine
      - name: Rodar o Engine
        working-directory: engine
        env:
          PULSO_API_URL: ${{ secrets.PULSO_API_URL }}
          PULSO_INGEST_TOKEN: ${{ secrets.PULSO_INGEST_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" != "true" ]; then
            python -m pulso_engine.pipeline
          else
            python -m pulso_engine.pipeline --push
          fi
      # Piloto de 48 h (COLLECTION_PROTOCOL.md §3): fontes sociais desativadas rodam aqui só se
      # o secret existir, NUNCA enviam ao Worker e o log mostra só contagens (repo público).
      - name: Piloto dos sensores sociais (sem envio)
        if: ${{ !cancelled() }}  # roda mesmo se o passo principal falhar, mas não em execução cancelada
        continue-on-error: true
        working-directory: engine
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ids=""
          if [ -n "$REDDIT_CLIENT_ID" ] && [ -n "$REDDIT_CLIENT_SECRET" ]; then ids="$ids --source reddit-politics --source reddit-clima"; fi
          if [ -n "$X_BEARER_TOKEN" ]; then ids="$ids --source x-politics --source x-clima"; fi
          if [ -n "$BLUESKY_HANDLE" ] && [ -n "$BLUESKY_APP_PASSWORD" ]; then ids="$ids --source bluesky-politics --source bluesky-clima"; fi
          if [ -z "$ids" ]; then echo "sem secrets sociais: piloto não roda"; exit 0; fi
          python -m pulso_engine.pipeline $ids --respect-interval
