name: Turso migrate

# Copia o D1 para o Turso (esquema + dados). Idempotente. Roda manualmente ou quando o commit traz a marca [turso-migrate].
on:
  workflow_dispatch:
  push:
    branches: [hen, main]

permissions:
  contents: read

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[turso-migrate]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exportar os dados do D1 (leitura)
        working-directory: apps/worker
        run: npx wrangler d1 export pulso --remote --no-schema --output ../../dump.sql
      - name: Copiar para o Turso
        run: python engine/scripts/turso_migrate.py dump.sql
