name: CI

on:
  pull_request:
    branches: [main, hen]
  push:
    branches: [hen]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        if: hashFiles('package.json') != ''
      - name: Instalar, checar tipos, lint e build
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run typecheck --if-present
          npm run lint --if-present
          npm run build --if-present
      - name: Sem package.json ainda
        if: hashFiles('package.json') == ''
        run: echo "Projeto ainda sem código; nada a validar."
